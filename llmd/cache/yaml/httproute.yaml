apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-d-sim-route
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: llm-d-lab-gateway
  rules:
  - backendRefs:
    - kind: Service
      name: llm-d-sim
      port: 8000
    matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 300s
