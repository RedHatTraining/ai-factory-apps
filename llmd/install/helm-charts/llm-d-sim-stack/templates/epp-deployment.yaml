apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-epp
  labels:
    {{- include "sim-stack.labels" . | nindent 4 }}
    {{- include "sim-stack.eppLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sim-stack.eppLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sim-stack.labels" . | nindent 8 }}
        {{- include "sim-stack.eppLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-epp
      terminationGracePeriodSeconds: 130
      containers:
        - name: epp
          image: {{ .Values.epp.image }}
          args:
            - "--pool-name={{ include "sim-stack.poolName" . }}"
            - "--pool-namespace={{ .Release.Namespace }}"
            - "--pool-group=inference.networking.k8s.io"
            - "--config-file=/config/default-plugins.yaml"
            - "--zap-encoder=json"
            - "--secure-serving=false"
            - "--metrics-endpoint-auth=false"
            - "--tracing=false"
          ports:
            - containerPort: 9002
              name: grpc-ext-proc
            - containerPort: 9003
              name: grpc-health
            - containerPort: 9090
              name: metrics
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: plugins-config
              mountPath: /config
              readOnly: true
          livenessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
              service: inference-extension
            periodSeconds: 2
          resources:
            {{- toYaml .Values.epp.resources | nindent 12 }}
      volumes:
        - name: plugins-config
          configMap:
            name: {{ .Release.Name }}-plugins
