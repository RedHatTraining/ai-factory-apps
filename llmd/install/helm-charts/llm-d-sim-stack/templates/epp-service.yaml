apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-epp
  labels:
    {{- include "sim-stack.labels" . | nindent 4 }}
    {{- include "sim-stack.eppLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sim-stack.eppLabels" . | nindent 4 }}
  ports:
    - name: grpc-ext-proc
      port: 9002
      targetPort: 9002
      protocol: TCP
    - name: http-metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
