apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "sim-stack.labels" . | nindent 4 }}
    {{- include "sim-stack.simulatorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sim-stack.simulatorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.simulator.port }}
      targetPort: {{ .Values.simulator.port }}
      protocol: TCP
