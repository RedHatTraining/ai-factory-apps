# llm-d Simulator Stack — values.yaml
#
# This chart creates the same resources that LLMInferenceService would
# auto-create in production, substituting the simulator for vLLM+GPU.
# All images except the simulator use RHOAI 3.4 Red Hat builds.
#
# Image digests are from the kserve-parameters ConfigMap on RHOAI 3.4.1 / OCP 4.20.25.
# To get current digests:
#   oc get cm kserve-parameters -n redhat-ods-applications -o yaml

# --- Simulator (replaces vLLM+GPU Deployment) ---
simulator:
  image: quay.io/redhattraining/llm-d-sim:v0.9.2-dataset
  replicas: 3
  model: Qwen/Qwen2.5-0.5B-Instruct
  port: 8000
  mode: random
  timeToFirstToken: "500ms"
  interTokenLatency: "50ms"
  datasetPath: /data/sharegpt-500.sqlite3
  datasetInMemory: true
  fakeMetrics:
    kv-cache-usage: 0.0
    running-requests: 0
    waiting-requests: 0
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      memory: "2Gi"

# --- vLLM Render sidecar (tokenizer for simulator) ---
# Runs as a native K8s sidecar in the simulator pods.
# Upstream image — part of the simulator exception (no Red Hat build exists).
vllmRender:
  image: vllm/vllm-openai-cpu:v0.21.0
  port: 8082
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      memory: "1Gi"

# --- EPP (Endpoint Picker) — RHOAI 3.4 image ---
# kserve-parameters key: kserve-llm-d-inference-scheduler
epp:
  image: "registry.redhat.io/rhoai/odh-llm-d-inference-scheduler-rhel9@sha256:bddf686d6eaf1a607e1c697f58165d685944607cb4629648f27e56b2884e3de0"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      memory: "1Gi"

# --- Monitoring ---
monitoring:
  enabled: true
  interval: "30s"
