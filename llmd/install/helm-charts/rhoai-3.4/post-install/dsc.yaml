# Patch the existing DataScienceCluster to enable WVA and KServe settings
# required for llm-d distributed inference.
#
# The DSC is already created by the cluster provisioning (agnosticv) using the
# v2 API (it has v2-only components like trainer: Managed).
# This patch adds the Workload Variant Autoscaler (WVA) and sets
# rawDeploymentServiceConfig to "Headed" for KServe.
#
# Apply with:
#   oc patch datasciencecluster default-dsc --type=merge -p "$(cat post-install/dsc.yaml)"
#
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
spec:
  components:
    kserve:
      managementState: Managed
      rawDeploymentServiceConfig: "Headed"
      wva:
        managementState: Managed
