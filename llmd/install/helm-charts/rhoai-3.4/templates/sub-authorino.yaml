{{- if and .Values.authorino.enabled (not (lookup "operators.coreos.com/v1alpha1" "Subscription" "openshift-operators" "authorino-operator")) }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: authorino-operator
  namespace: openshift-operators
  labels:
    {{- include "rhoai.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.authorino.channel }}
  installPlanApproval: Automatic
  name: authorino-operator
  source: {{ .Values.catalog.source }}
  sourceNamespace: {{ .Values.catalog.sourceNamespace }}
  {{- if .Values.authorino.startingCSV }}
  startingCSV: {{ .Values.authorino.startingCSV }}
  {{- end }}
{{- end }}
