{{- if and .Values.kuadrant.enabled (not (lookup "operators.coreos.com/v1alpha1" "Subscription" .Values.kuadrant.namespace "rhcl-operator")) }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: {{ .Values.kuadrant.namespace }}
  labels:
    {{- include "rhoai.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.kuadrant.channel }}
  installPlanApproval: Automatic
  name: rhcl-operator
  source: {{ .Values.catalog.source }}
  sourceNamespace: {{ .Values.catalog.sourceNamespace }}
  {{- if .Values.kuadrant.startingCSV }}
  startingCSV: {{ .Values.kuadrant.startingCSV }}
  {{- end }}
{{- end }}
