{{- if and .Values.nfd.enabled (not (lookup "operators.coreos.com/v1alpha1" "Subscription" .Values.nfd.namespace "nfd")) }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: nfd
  namespace: {{ .Values.nfd.namespace }}
  labels:
    {{- include "rhoai.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.nfd.channel }}
  installPlanApproval: Automatic
  name: nfd
  source: {{ .Values.catalog.source }}
  sourceNamespace: {{ .Values.catalog.sourceNamespace }}
  {{- if .Values.nfd.startingCSV }}
  startingCSV: {{ .Values.nfd.startingCSV }}
  {{- end }}
{{- end }}
