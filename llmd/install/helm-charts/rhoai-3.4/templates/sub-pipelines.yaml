{{- if and .Values.pipelines.enabled (not (lookup "operators.coreos.com/v1alpha1" "Subscription" "openshift-operators" "openshift-pipelines-operator-rh")) }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-pipelines-operator-rh
  namespace: openshift-operators
  labels:
    {{- include "rhoai.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.pipelines.channel }}
  installPlanApproval: Automatic
  name: openshift-pipelines-operator-rh
  source: {{ .Values.catalog.source }}
  sourceNamespace: {{ .Values.catalog.sourceNamespace }}
  {{- if .Values.pipelines.startingCSV }}
  startingCSV: {{ .Values.pipelines.startingCSV }}
  {{- end }}
{{- end }}
