{{- if and .Values.serverless.enabled (not (lookup "operators.coreos.com/v1alpha1" "Subscription" .Values.serverless.namespace "serverless-operator")) }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: serverless-operator
  namespace: {{ .Values.serverless.namespace }}
  labels:
    {{- include "rhoai.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.serverless.channel }}
  installPlanApproval: Automatic
  name: serverless-operator
  source: {{ .Values.catalog.source }}
  sourceNamespace: {{ .Values.catalog.sourceNamespace }}
  {{- if .Values.serverless.startingCSV }}
  startingCSV: {{ .Values.serverless.startingCSV }}
  {{- end }}
{{- end }}
