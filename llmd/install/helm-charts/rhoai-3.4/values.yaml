# Operator catalog defaults
catalog:
  source: redhat-operators
  sourceNamespace: openshift-marketplace

# Red Hat OpenShift Service Mesh 3 (all-namespace operator — installs into openshift-operators)
servicemesh3:
  enabled: true
  channel: stable-3.4  # Most specific channel for version 3.4.x

# Custom Metrics Autoscaler (KEDA) — required for Workload Variant Autoscaler (WVA)
keda:
  enabled: true
  channel: stable  # Only channel available
  namespace: openshift-keda

# User Workload Monitoring — required for Prometheus metrics collection
monitoring:
  userWorkload:
    enabled: true
