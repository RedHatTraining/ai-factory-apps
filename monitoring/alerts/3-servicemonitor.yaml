apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: granite-monitor-metrics
  namespace: monitoring-alerts
spec:
  endpoints:
    - path: /metrics
      port: http
      interval: 30s
  namespaceSelector:
    matchNames:
      - monitoring-alerts
  selector:
    matchLabels:
      serving.kserve.io/inferenceservice: granite-monitor
