apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vllm-inference-alerts
  namespace: monitoring-alerts
spec:
  groups:
  - name: vllm-inference-slos
    rules:
    - alert: VLLMHighQueueBacklog
      expr: vllm:num_requests_waiting > 5
      for: 2m
      labels:
        severity: warning
      annotations:
        description: "Request queue backlog exceeds 5 for more than 2 minutes"
        summary: "Model serving queue backing up"
    - alert: VLLMKVCacheSaturation
      expr: vllm:kv_cache_usage_perc > 0.9
      for: 5m
      labels:
        severity: critical
      annotations:
        description: "KV cache usage above 90% for more than 5 minutes"
        summary: "KV cache approaching capacity"
