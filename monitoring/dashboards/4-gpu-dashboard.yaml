apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gpu-health-dashboard
  namespace: grafana-monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: >
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "GPU Utilization (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "DCGM_FI_DEV_GPU_UTIL{namespace=\"monitoring-dashboards\"}",
              "legendFormat": "GPU {{gpu}} - {{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "GPU Temperature (°C)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "DCGM_FI_DEV_GPU_TEMP{namespace=\"monitoring-dashboards\"}",
              "legendFormat": "GPU {{gpu}} - {{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "GPU Power Usage (W)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "DCGM_FI_DEV_POWER_USAGE{namespace=\"monitoring-dashboards\"}",
              "legendFormat": "GPU {{gpu}} - {{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "GPU Memory (MiB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "decmbytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "DCGM_FI_DEV_FB_USED{namespace=\"monitoring-dashboards\"}",
              "legendFormat": "Used - GPU {{gpu}}",
              "refId": "A"
            },
            {
              "expr": "DCGM_FI_DEV_FB_FREE{namespace=\"monitoring-dashboards\"}",
              "legendFormat": "Free - GPU {{gpu}}",
              "refId": "B"
            }
          ]
        },
        {
          "title": "Request Queue Depth",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "vllm:num_requests_waiting{namespace=\"monitoring-dashboards\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "KV Cache Usage (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "vllm:kv_cache_usage_perc{namespace=\"monitoring-dashboards\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "GPU Errors (XID)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "DCGM_FI_DEV_XID_ERRORS{namespace=\"monitoring-dashboards\"}",
              "legendFormat": "GPU {{gpu}} - {{pod}}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "GPU Health Overview",
      "uid": "gpu-health-overview"
    }
