apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: vllm-inference-dashboard
  namespace: grafana-monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: >
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "rate(vllm:request_success_total{namespace=\"monitoring-dashboards\"}[5m])",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Token Throughput (tokens/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "rate(vllm:prompt_tokens_total{namespace=\"monitoring-dashboards\"}[5m])",
              "legendFormat": "Prompt - {{pod}}",
              "refId": "A"
            },
            {
              "expr": "rate(vllm:generation_tokens_total{namespace=\"monitoring-dashboards\"}[5m])",
              "legendFormat": "Generation - {{pod}}",
              "refId": "B"
            }
          ]
        },
        {
          "title": "Request Success by Finish Reason",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "vllm:request_success_total{namespace=\"monitoring-dashboards\"}",
              "legendFormat": "{{finished_reason}} - {{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "E2E Request Latency (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(vllm:e2e_request_latency_seconds_bucket{namespace=\"monitoring-dashboards\"}[5m])) by (le, pod))",
              "legendFormat": "p50 - {{pod}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(vllm:e2e_request_latency_seconds_bucket{namespace=\"monitoring-dashboards\"}[5m])) by (le, pod))",
              "legendFormat": "p95 - {{pod}}",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(vllm:e2e_request_latency_seconds_bucket{namespace=\"monitoring-dashboards\"}[5m])) by (le, pod))",
              "legendFormat": "p99 - {{pod}}",
              "refId": "C"
            }
          ]
        },
        {
          "title": "Time to First Token (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(vllm:time_to_first_token_seconds_bucket{namespace=\"monitoring-dashboards\"}[5m])) by (le, pod))",
              "legendFormat": "p50 - {{pod}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(vllm:time_to_first_token_seconds_bucket{namespace=\"monitoring-dashboards\"}[5m])) by (le, pod))",
              "legendFormat": "p95 - {{pod}}",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(vllm:time_to_first_token_seconds_bucket{namespace=\"monitoring-dashboards\"}[5m])) by (le, pod))",
              "legendFormat": "p99 - {{pod}}",
              "refId": "C"
            }
          ]
        },
        {
          "title": "Time per Output Token (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(vllm:time_per_output_token_seconds_bucket{namespace=\"monitoring-dashboards\"}[5m])) by (le, pod))",
              "legendFormat": "p50 - {{pod}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(vllm:time_per_output_token_seconds_bucket{namespace=\"monitoring-dashboards\"}[5m])) by (le, pod))",
              "legendFormat": "p95 - {{pod}}",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(vllm:time_per_output_token_seconds_bucket{namespace=\"monitoring-dashboards\"}[5m])) by (le, pod))",
              "legendFormat": "p99 - {{pod}}",
              "refId": "C"
            }
          ]
        },
        {
          "title": "Running Requests",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "vllm:num_requests_running{namespace=\"monitoring-dashboards\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Waiting Requests",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "vllm:num_requests_waiting{namespace=\"monitoring-dashboards\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "vLLM Inference Investigation",
      "uid": "vllm-inference-investigation"
    }
