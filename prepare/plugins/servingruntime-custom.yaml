apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-custom-qwen3-runtime
  namespace: prepare-plugins
  annotations:
    opendatahub.io/template-display-name: vLLM Custom Qwen3 Runtime
  labels:
    opendatahub.io/dashboard: "true"
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
  - name: kserve-container
    image: image-registry.openshift-image-registry.svc:5000/prepare-plugins/vllm-custom-qwen3:3.4.0
    command:
    - python
    - -m
    - vllm.entrypoints.openai.api_server
    args:
    - --port=8080
    - --model=/mnt/models
    - --served-model-name={{.Name}}
    env:
    - name: VLLM_PLUGINS
      value: "custom_qwen3"
    - name: HF_HOME
      value: /tmp/hf_home
    ports:
    - containerPort: 8080
      protocol: TCP
  multiModel: false
  supportedModelFormats:
  - autoSelect: true
    name: vLLM