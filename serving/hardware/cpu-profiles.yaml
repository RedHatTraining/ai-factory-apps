apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  annotations:
    opendatahub.io/dashboard-feature-visibility: '[]'
    opendatahub.io/description: >-
      A CPU-intensive profile for data preprocessing and non-GPU workloads.
      Offers 4 CPUs and 8 GiB of memory by default, scaling up to 8 CPUs
      and 16 GiB of memory.
    opendatahub.io/disabled: "false"
    opendatahub.io/display-name: High CPU
    opendatahub.io/managed: "false"
  labels:
    app.kubernetes.io/part-of: hardwareprofile
    app.opendatahub.io/hardwareprofile: "true"
  name: high-cpu-profile
  namespace: redhat-ods-applications
spec:
  identifiers:
  - defaultCount: 4
    displayName: CPU
    identifier: cpu
    maxCount: 8
    minCount: 2
    resourceType: CPU
  - defaultCount: 8Gi
    displayName: Memory
    identifier: memory
    maxCount: 16Gi
    minCount: 4Gi
    resourceType: Memory