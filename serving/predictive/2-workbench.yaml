---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: serving-predictive-wb
  namespace: serving-predictive
  labels:
    opendatahub.io/dashboard: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: serving-predictive-wb
  namespace: serving-predictive
  labels:
    app: serving-predictive-wb
    opendatahub.io/dashboard: "true"
    opendatahub.io/odh-managed: "true"
  annotations:
    notebooks.opendatahub.io/inject-oauth: "true"
    notebooks.opendatahub.io/last-image-selection: s2i-generic-data-science-notebook:3.4
    opendatahub.io/image-display-name: "Jupyter | Data Science | CPU | Python 3.12"
spec:
  template:
    spec:
      containers:
        - name: serving-predictive-wb
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.4
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          env:
            - name: NOTEBOOK_ARGS
              value: "--NotebookApp.token='' --NotebookApp.password=''"
          envFrom:
            - secretRef:
                name: models-s3
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          volumeMounts:
            - name: notebook-data
              mountPath: /opt/app-root/src
      volumes:
        - name: notebook-data
          persistentVolumeClaim:
            claimName: serving-predictive-wb
