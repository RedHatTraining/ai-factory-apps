apiVersion: v1
kind: ConfigMap
metadata:
  name: model-catalog-sources
  namespace: rhoai-model-registries
data:
  sources.yaml: |
    catalogs:
      - id: redhat_ai_models
        enabled: false
      - id: redhat_ai_validated_models
        enabled: true
        includedModels:
          - RedHatAI/gpt-oss*
      - id: "source-lab"
        name: "My Company Custom Models"
        type: "yaml"
        properties:
          yamlCatalogPath: "/data/user-model-sources/lab-models.yaml"
        labels:
          - MyCompany Custom

  lab-models.yaml: |
    models:
      - name: "MyCompany/Qwen3-0.6b"
        provider: MyCompany
        description: The model is designed to respond to general instructions and can be used to build AI assistants for multiple domains, including business applications.
        readme: |-
          # Qwen3-0.6b customized for My Company

          Version 1.0 of the base Qwen3-0.6b model fine-tuned for My Company.

          You can add other notes here for the consumers of this model.

          ## Model Overview
          - **Model Architecture:** Qwen3-0.6b
          - **Input:** Text
          - **Output:** Text
          - **Model Optimizations:**
            - **Weight quantization:** FP8
            - **Activation quantization:** FP8
            - **Release Date:** 1/1/2026
            - **Version:** 1.0
          
          ## Evaluation
          The model was evaluated on the following tasks:
          - Task 1
          - Task 2
          - Task 3

          The model achieved the following scores:
          - Score 1
          - Score 2
          - Score 3
        language:
          - en
          - zh
        license: apache-2.0
        licenseLink: https://www.apache.org/licenses/LICENSE-2.0
        tasks:
          - text-generation
          - tool-calling
          - chatbot
        customProperties:
          model_type:
              metadataType: MetadataStringValue
              string_value: "generative"
          status:
              metadataType: MetadataStringValue
              string_value: "experimental"
          author:
              metadataType: MetadataStringValue
              string_value: "My company"
          version:
              metadataType: MetadataStringValue
              string_value: "1.0"
        artifacts:
          - name: "qwen3-0.6b"
            uri: "oci://quay.io/redhattraining/oci-models/qwen3_0.6b"
        logo: data:image/svg+xml;base64,
